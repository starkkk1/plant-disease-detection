name: CI and publish containers

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test-only dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx scikit-learn albumentations PyYAML
      - name: Run Python tests (synthetic fixture weights; no real checkpoint)
        run: python -m pytest tests -q

  frontend-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image-build:
    name: Verify checkpoint-free Docker image
    needs: [python-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -f Dockerfile.deploy -t plant-disease-api:ci .

  frontend-image:
    name: Build and smoke-test frontend container
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production frontend image
        run: >-
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t plant-disease-frontend:ci ./frontend
      - name: Check runtime health, pages and static assets
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name frontend-ci -p 127.0.0.1:3000:3000 plant-disease-frontend:ci
          trap 'docker logs frontend-ci; docker rm -f frontend-ci' EXIT
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' frontend-ci)
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' frontend-ci)" = healthy
          test "$(docker exec frontend-ci id -u)" != 0
          curl --fail --silent --show-error http://127.0.0.1:3000/research > /dev/null
          docker exec -i frontend-ci node <<'JS'
          const assert = require('node:assert/strict');
          (async () => {
            const origin = 'http://127.0.0.1:3000';
            const response = await fetch(origin);
            assert.equal(response.status, 200);
            const html = await response.text();
            const assets = [...new Set(html.match(/\/_next\/static\/[^"\s<>]+\.(?:js|css)/g) || [])];
            assert.ok(assets.length > 0, 'No Next.js static assets found');
            for (const asset of assets) {
              assert.equal((await fetch(new URL(asset, origin))).status, 200, asset);
            }
            console.log(`Frontend page and ${assets.length} static assets passed`);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Save verified frontend image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: docker save plant-disease-frontend:ci | gzip > /tmp/frontend-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish backend and frontend to GHCR (master only)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [python-tests, frontend-build, image-build, frontend-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: |
            ghcr.io/starkkk1/plant-disease-detection-api:latest
            ghcr.io/starkkk1/plant-disease-detection-api:${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend-image
      - name: Publish verified frontend image
        run: |
          docker load -i /tmp/frontend-image/frontend-image.tar.gz
          docker tag plant-disease-frontend:ci ghcr.io/starkkk1/plant-disease-detection-frontend:latest
          docker tag plant-disease-frontend:ci ghcr.io/starkkk1/plant-disease-detection-frontend:${{ github.sha }}
          docker push ghcr.io/starkkk1/plant-disease-detection-frontend:latest
          docker push ghcr.io/starkkk1/plant-disease-detection-frontend:${{ github.sha }}
