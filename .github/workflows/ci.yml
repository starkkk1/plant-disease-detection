name: CI and publish container

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test-only dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx scikit-learn albumentations PyYAML
      - name: Run Python tests (synthetic fixture weights; no real checkpoint)
        run: python -m pytest tests -q

  frontend-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image-build:
    name: Verify checkpoint-free Docker image
    needs: [python-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -f Dockerfile.deploy -t plant-disease-api:ci .

  publish:
    name: Publish image to GHCR (master only)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [python-tests, frontend-build, image-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.deploy
          push: true
          tags: |
            ghcr.io/starkkk1/plant-disease-detection-api:latest
            ghcr.io/starkkk1/plant-disease-detection-api:${{ github.sha }}
