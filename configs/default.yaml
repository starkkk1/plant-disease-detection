project:
  name: lightweight-plant-disease
  seed: 42
  task: tomato_leaf_disease_classification

data:
  raw_root: D:\Code\python\data+source\PlantVillage-Dataset\raw\color
  processed_root: D:\Code\python\plant-disease-detection\data\plantvillage_tomato_full
  train_dir: D:\Code\python\plant-disease-detection\data\plantvillage_tomato_full\train
  val_dir: D:\Code\python\plant-disease-detection\data\plantvillage_tomato_full\val
  test_dir: D:\Code\python\plant-disease-detection\data\plantvillage_tomato_full\eval\three_class_external
  class_map: D:\Code\python\plant-disease-detection\data\plantvillage_tomato_full\metadata\class_to_idx.json
  eval_three_class_dir: D:\Code\python\plant-disease-detection\data\plantvillage_tomato_full\eval\three_class_external
  eval_bangladesh_dir: D:\Code\python\plant-disease-detection\data\plantvillage_tomato_full\eval\bangladesh_binary
  eval_multileaf_dir: D:\Code\python\plant-disease-detection\data\plantvillage_tomato_full\eval\multileaf_late_blight
  image_size: 224
  batch_size: 32
  num_workers: 4

model:
  name: resnet50
  num_classes: 10
  pretrained: true

training:
  epochs: 30
  head_epochs: 5
  lr: 1.0e-4
  fine_tune_lr: 1.0e-5
  optimizer: adam
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 3
  early_stopping_patience: 5
  monitor_metric: val_f1_macro
  use_class_weights: true

augmentation:
  train:
    random_horizontal_flip: true
    rotation_degrees: 15
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    random_resized_crop: true
    crop_scale_min: 0.8
    crop_scale_max: 1.0
  val_test:
    resize: 256
    center_crop: 224

normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

output:
  checkpoint_dir: checkpoints
  results_dir: results
  reports_dir: reports
  log_dir: results/logs
